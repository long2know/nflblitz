name: Game source checks

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Assets.meta'
      - 'tests/**'
      - 'tools/assets/**'
      - 'tools/animation/**'
      - 'tools/rosters/**'
      - 'tools/playbooks/**'
      - 'tools/movement/**'
      - 'tools/interface/**'
      - 'tools/audio/**'
      - 'tools/environments/**'
      - 'tools/fire-spfx/**'
      - 'scripts/**'
      - 'hosting/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'README.md'
      - 'docs/build.md'
      - 'docs/source-parity.md'
      - 'docs/architecture.md'
      - '.github/workflows/game-build.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Assets.meta'
      - 'tests/**'
      - 'tools/assets/**'
      - 'tools/animation/**'
      - 'tools/rosters/**'
      - 'tools/playbooks/**'
      - 'tools/movement/**'
      - 'tools/interface/**'
      - 'tools/audio/**'
      - 'tools/environments/**'
      - 'tools/fire-spfx/**'
      - 'scripts/**'
      - 'hosting/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'README.md'
      - 'docs/build.md'
      - 'docs/source-parity.md'
      - 'docs/architecture.md'
      - '.github/workflows/game-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-tooling:
    name: Core inventory and build-tool units (no Unity)
    runs-on: ubuntu-24.04
    # Measured full-chain runtime exceeds 30m on slower runners; keep every campaign required.
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BLITZ_CI_MUTATION_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.1'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.100'
      - name: Select the tested SDK
        run: |
          printf '{"sdk":{"version":"10.0.100","rollForward":"disable"}}\n' > global.json
      - name: Core tests with exact case inventory and source hash guard
        run: python3 tests/run-core.py
      - name: Test the inventory failure gates
        run: |
          python3 -B tests/ci/test_mutation_workers.py -q
          python3 tests/test-runner.py
          python3 -B tests/kick-meter/test_runner.py -q
          python3 -B tests/fire-kick-integration/test_runner.py -q
          python3 -B -m unittest discover -s tests/fire-producers -p 'test_*.py' -q
          python3 -B -m unittest discover -s tests/audio/runtime -p 'test_ci.py' -q
          python3 -B tests/movement-callers/test_public_replay.py -q
          python3 -B tests/movement-callers/test_replay_generations.py -q
          python3 -B tests/source-host-lifecycle/run.py --output tests/source-host-lifecycle/.artifacts/ci-managed --controls
          python3 -B tests/impact-dust/test_ci.py
          python3 -B tests/impact-dust/run.py --output .squad/.scratch/impact-dust-ci --controls
          python3 -B tests/impact-dust/js_controls.py --output .squad/.scratch/impact-dust-js-ci
          python3 -B tests/loose-helmet/test_ci.py
          python3 -B tests/loose-helmet/run.py --output .squad/.scratch/loose-helmet-ci --controls
          python3 -B tests/loose-helmet/js_controls.py --output .squad/.scratch/loose-helmet-js-ci
      - name: Test detached source match and input contracts
        run: |
          python3 tests/contracts/test_runner.py
          python3 tests/contracts/run.py
      - name: Test offline roster exporter without original data
        run: python3 -B -m unittest discover -s tools/rosters/tests -q
      - name: Test immutable roster reader against synthetic input
        run: |
          python3 -B tools/rosters/tests/fixtures.py
          dotnet run --project tools/rosters/checks/SourceRoster.Checks.csproj --configuration Release -p:NuGetAudit=false -- tools/rosters/SourceData/synthetic-rosters.json
      - name: Test original playbook runner failure gates
        run: python3 -B -m unittest discover -s tests/playbooks -p 'test_*.py' -q
      - name: Fetch verified original playbook and AI inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/playbooks/fetch_inputs.py
      - name: Compare original playbooks and AI decisions
        run: python3 tests/playbooks/run.py
      - name: Compare original movement and evasion without Unity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/movement/run.py --fetch-inputs --sdk-netstandard21
          python3 -B -m unittest discover -s tests/movement -p 'test_publication.py' -q
      - name: Test original environment conversion without original assets
        run: |
          python3 -B tools/environments/test_prepare_environment.py -q
          python3 -B tools/environments/test_publication_profiles.py -q
          python3 -B tools/environments/run_reader_checks.py --synthetic-only
      - name: Fetch verified original C oracle inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/source-oracles/fetch_inputs.py
      - name: Test pinned-source oracle extraction
        run: python3 -B -m unittest discover -s tests/source-oracles -p 'test_*.py'
      - name: Execute original C reference cases
        run: python3 tests/source-oracles/run.py --source-root tests/source-oracles/.artifacts/original --full-matrix
      - name: Fetch verified real source-kernel inputs
        # The explicit78 union preserves all69 historical pins; no fixture is relabelled.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/parity/fetch_inputs.py --profile contact272 --download --cache tests/source-oracles/.artifacts/original --output .squad/.scratch/SourceData/source-kernel-original
      - name: Prepare original animation geometry roster and playbook services
        run: python3 tests/parity/prepare_inputs.py --source-root .squad/.scratch/SourceData/source-kernel-original --output .squad/.scratch/SourceData/source-kernel
      - name: Prepare strict current Contact272 and explicit C2 M1 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tests/contact/prepare.py --source-root .squad/.scratch/SourceData/source-kernel-original --operand-root .squad/.scratch/SourceData/source-kernel-original --base-bundle .squad/.scratch/SourceData/source-kernel/movement-animation --download
          python3 -B tools/animation/prepare_contact_profile.py prepare --source-root .squad/.scratch/SourceData/source-kernel-original --base-bundle .squad/.scratch/SourceData/source-kernel/movement-animation --destination .squad/.scratch/SourceData/contact-profile/animation272
          python3 -B tools/assets/prepare_cinematics.py --source-root .squad/.scratch/SourceData/source-kernel-original --destination .squad/.scratch/SourceData/contact-profile/impact-base
          python3 -B tools/animation/prepare_contact_impact.py --base-catalog .squad/.scratch/SourceData/contact-profile/impact-base/impact-presentation.json --plyrseq .squad/.scratch/SourceData/source-kernel-original/plyrseq.c --contact-programs Assets/Scripts/Gameplay/SourceAnimationPrograms.Contact.cs --animation-manifest .squad/.scratch/SourceData/contact-profile/animation272/export-inventory.json --destination .squad/.scratch/SourceData/contact-profile/impact272
          python3 -B tests/parity/prepare_contact_inputs.py --profile contact272 --legacy-fixture .squad/.scratch/SourceData/source-kernel/fixture.json --production-bundle .squad/.scratch/SourceData/contact-profile/animation272 --supplemental-bundle tests/contact/.artifacts/contact-extra --impact .squad/.scratch/SourceData/contact-profile/impact272/impact-presentation.json --output .squad/.scratch/SourceData/source-kernel-contact272
          python3 -B tools/animation/prepare_player_sequences.py --source-root .squad/.scratch/SourceData/source-kernel-original --catalog tools/animation/c2_sequences.json --destination .squad/.scratch/SourceData/c2-extra9
          python3 -B tools/animation/prepare_c2_profile.py --source-root .squad/.scratch/SourceData/source-kernel-original --base-bundle .squad/.scratch/SourceData/source-kernel-contact272/contact-animation --extra-bundle .squad/.scratch/SourceData/c2-extra9 --destination .squad/.scratch/SourceData/c2-old9
          python3 -B tools/animation/prepare_c2_impact.py --base-catalog .squad/.scratch/SourceData/contact-profile/impact272/impact-presentation.json --callback-data .squad/.scratch/SourceData/c2-old9/c2-callback-data.json --plyrseq .squad/.scratch/SourceData/source-kernel-original/plyrseq.c --programs Assets/Scripts/Gameplay/SourceAnimationPrograms.C2.cs --destination .squad/.scratch/SourceData/contact-profile/impact-old9
          python3 -B tools/animation/prepare_c2_profile.py --source-root .squad/.scratch/SourceData/source-kernel-original --base-bundle .squad/.scratch/SourceData/source-kernel-contact272/contact-animation --extra-bundle .squad/.scratch/SourceData/c2-extra9 --profile contact281-c2-m1 --destination .squad/.scratch/SourceData/c2-m1
          python3 -B tools/animation/prepare_c2_impact.py --base-catalog .squad/.scratch/SourceData/contact-profile/impact272/impact-presentation.json --callback-data .squad/.scratch/SourceData/c2-m1/c2-callback-data.json --plyrseq .squad/.scratch/SourceData/source-kernel-original/plyrseq.c --programs Assets/Scripts/Gameplay/SourceAnimationPrograms.C2.cs --profile contact281-c2-m1 --destination .squad/.scratch/SourceData/contact-profile/impact-m1
      - name: Prepare exact public replay input without simulation
        run: python3 -B tests/movement-callers/prepare_public_replay.py prepare --case portable-cabinet-wide-pass-clearance-12000 --fixture tests/movement-callers/fixtures/portable-cabinet-wide-pass-clearance-12000.jsonl.gz --recipe tests/movement-callers/fixtures/portable-cabinet-wide-pass-clearance-12000.recipe.json --output .squad/.scratch/SourceData/portable-cabinet-wide-pass-clearance-12000.jsonl
      - name: Prepare source-current public replay input without simulation
        run: python3 -B tests/movement-callers/prepare_public_replay.py prepare --case portable-cabinet-wide-pass-clearance-possession-12000 --fixture tests/movement-callers/fixtures/portable-cabinet-wide-pass-clearance-possession-12000.jsonl.gz --recipe tests/movement-callers/fixtures/portable-cabinet-wide-pass-clearance-possession-12000.recipe.json --output .squad/.scratch/SourceData/portable-cabinet-wide-pass-clearance-possession-12000.jsonl
      - name: Check historical and stale public replay generations
        run: python3 -B tests/movement-callers/check_replay_generations.py --baseline-ref cf3f2b5db3cc94ac3f51e01dae94dd74d90ebc02 --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn --c2-m1-inputs .squad/.scratch/SourceData/c2-m1 --replay-commands .squad/.scratch/SourceData/portable-cabinet-wide-pass-clearance-12000.jsonl --output .squad/.scratch/public-replay-generation-ci
      - name: Test real-input fixture and ball-runner failure gates
        run: |
          python3 tests/parity/test_inputs.py
          python3 tests/parity/test_contact_inputs.py
          python3 tests/ball/test_runner.py
          python3 tests/contact/test_runner.py
          python3 tests/movement-callers/test_runner.py
          python3 tests/movement-callers/test_canonical.py
          python3 -B tests/match-lifecycle/test_runner.py -q
          python3 tests/audio/vm/test_runner.py
      - name: Compare source gameplay and host adapter
        # Retained historical numeric/short-adapter comparison, not current caller qualification.
        run: python3 tests/parity/run.py --cases tests/source-oracles/.artifacts/cases.json --full-kernel --input-profile legacy --fixture-manifest .squad/.scratch/SourceData/source-kernel/fixture.json
      - name: Compare original ball and ordered source callers
        run: python3 tests/ball/run.py --source-root .squad/.scratch/SourceData/source-kernel-original --input-profile contact272 --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn
      - name: Test explicit Portable carrierless switching and defined original C
        run: python3 -B tests/movement-callers/compatibility.py --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn --c2-m1-inputs .squad/.scratch/SourceData/c2-m1 --old-c2-inputs .squad/.scratch/SourceData/c2-old9 --carrierless-switch-only --source-root .squad/.scratch/SourceData/source-kernel-original --output .squad/.scratch/carrierless-switch-ci
      - name: Test actual source terminal producer and real bridge notification
        run: python3 -B tests/match-lifecycle/run.py --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn --c2-m1-inputs .squad/.scratch/SourceData/c2-m1 --output .squad/.scratch/match-terminal-ci --controls
      - name: Compare original movement callers and post-animation physics
        # REQUIRED full OPT-IN PORTABLE gate, not native parity; faults/UNMET remain nonzero.
        run: python3 tests/movement-callers/run.py --source-root .squad/.scratch/SourceData/source-kernel-original --input-profile contact272 --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn --c2-m1-inputs .squad/.scratch/SourceData/c2-m1 --replay-commands .squad/.scratch/SourceData/portable-cabinet-wide-pass-clearance-possession-12000.jsonl --output .squad/.scratch/m1-ci-full-qualification --source-compatibility portable
      - name: Test source-player preparation without original assets
        run: python3 -B -m unittest discover -s tools/assets -p 'test_*.py'
      - name: Test original-animation input reader without original assets
        run: |
          python3 -B -m unittest discover -s tools/animation/tests
          python3 -B tools/animation/prepare_contact_impact.py --help > /dev/null
          python3 -B tools/animation/prepare_c2_impact.py --help > /dev/null
      - name: Test generated-player parsing and geometry
        run: python3 tests/assets/run.py
      - name: Test source-camera behavior
        run: python3 tests/camera/run.py
      - name: Test source team and impact helpers without original assets
        run: python3 tests/presentation/run.py
      - name: Test original HUD and cabinet interface without original assets
        run: python3 tests/interface/run.py
      - name: Test complete interface caller and inventory guards
        run: python3 tests/interface/stage_followup.py
      - name: Test actual movement bootstrap and source-frame binding
        run: python3 tests/interface/movement_bootstrap.py
      - name: Test original HUD resource preflight without assets or Unity
        run: python3 tests/presentation/interface-packaging/run.py --b1-root . --ui-root . --team-root .
      - name: Compare original source-camera matrices and complete animation identity
        run: python3 tests/presentation/movement-stage/run.py --original-source-root .squad/.scratch/SourceData/source-kernel-original --bundle157-root .squad/.scratch/SourceData/source-kernel/movement-animation
      - name: Compare active original normal kickoff and impact-return camera wakes
        run: |
          python3 -B tests/presentation/normal-camera/test_ci.py
          python3 -B tests/presentation/normal-camera/run.py --source-root .squad/.scratch/SourceData/source-kernel-original --output .squad/.scratch/raw-camera-ci --controls
      - name: Fetch authenticated active possession service inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/presentation/possession-services/fetch_inputs.py --output .squad/.scratch/SourceData/possession-service-original
      - name: Compare active original possession messages and process services
        run: |
          python3 -B tests/presentation/possession-services/prepare.py --original .squad/.scratch/SourceData/possession-service-original --output .squad/.scratch/SourceData/possession-services
          python3 -B tests/presentation/possession-services/test_ci.py --original .squad/.scratch/SourceData/possession-service-original --prepared .squad/.scratch/SourceData/possession-services --output .squad/.scratch/possession-service-ci-guards
          python3 -B tests/presentation/possession-services/run.py --fixture .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn --m1 .squad/.scratch/SourceData/c2-m1 --impact .squad/.scratch/SourceData/contact-profile/impact-m1/impact-presentation.json --normal .squad/.scratch/raw-camera-ci/original-C/normal.json --speech .squad/.scratch/SourceData/possession-services/speech/possession-speech.bytes --hud .squad/.scratch/SourceData/possession-services/hud/interface.json --fire .squad/.scratch/SourceData/possession-services/fire --fire-sha256 90a134af37fe6d43f13977f7903315ee0d9a7f37f700669b365f45dd7c941d56 --authority .squad/.scratch/SourceData/possession-services/authority --output .squad/.scratch/possession-services-ci --controls
      - name: Test source-camera frame and resource mutations
        run: python3 tests/presentation/movement-stage/mutations.py
      - name: Test original audio package reader without banks or Unity
        run: python3 tests/audio/run.py --mutate
      - name: Test actor sound input preparation and SDK boundaries
        run: |
          python3 -B -m unittest discover -s tests/audio/functions -p 'test_*.py'
          python3 tests/audio/functions/run.py
      - name: Compare original actor sound selectors and source mutants
        run: |
          python3 tools/audio/fetch_function_inputs.py --source-root .squad/.scratch/SourceData/source-kernel-original --destination tools/audio/.artifacts/source/nflblitz2000
          python3 tools/audio/prepare_functions.py --name publication-original
          python3 tests/audio/functions/run.py --original tools/audio/.artifacts/functions/publication-original --reproduce publication-repeat --mutate
      - name: Compare synchronous original sound VM and source mutants
        run: python3 -B tests/audio/vm/run.py --input-profile contact272 --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions --source-root .squad/.scratch/SourceData/source-kernel-original --mutations
      - name: Test resolved sound Runtime and actual Core batches
        run: python3 -B tests/audio/runtime/run.py --fixture-manifest .squad/.scratch/SourceData/source-kernel-contact272/fixture.json --sound-functions .squad/.scratch/SourceData/source-kernel-contact272/audio-functions/sound-functions.safn
      - name: Test explicit sound resources and resolved consumer without Unity
        run: |
          python3 -B tests/presentation/sound-runtime/run.py
          python3 -B tests/presentation/sound-runtime/mutations.py
      - name: Test Contact272 SDK preflight and callers without original assets
        run: |
          python3 -B -m unittest discover -s tests/presentation/contact-runtime -p 'test_callers.py' -q
          python3 -B tests/presentation/contact-runtime/run.py
          python3 -B tests/presentation/contact-runtime/mutations.py
      - name: Test opt-in Contact281C2 SDK preflight and callers without original assets
        run: |
          python3 -B -m unittest discover -s tests/presentation/c2-runtime -p 'test_callers.py' -q
          python3 -B tests/presentation/c2-runtime/run.py
          python3 -B tests/presentation/c2-runtime/mutations.py
      - name: Test browser assertions and isolated runtime
        run: node --test tests/browser/lib.test.mjs tests/browser/runtime.test.mjs tests/viewport/gpu.test.mjs
      - name: Validate Unity metadata and script references
        run: python3 tests/test-unity-metadata.py
      - name: Build-tool unit checks
        run: python3 scripts/test-webgl-tooling.py
      - name: Build and hosting shell syntax
        run: |
          bash -n scripts/build-webgl.sh scripts/serve-webgl.sh
          sh -n scripts/verify-webgl.sh hosting/entrypoint.sh
