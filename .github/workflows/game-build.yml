name: Game source checks

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Assets.meta'
      - 'tests/**'
      - 'tools/assets/**'
      - 'tools/animation/**'
      - 'tools/rosters/**'
      - 'tools/playbooks/**'
      - 'tools/movement/**'
      - 'tools/audio/**'
      - 'tools/environments/**'
      - 'scripts/**'
      - 'hosting/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/game-build.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Assets.meta'
      - 'tests/**'
      - 'tools/assets/**'
      - 'tools/animation/**'
      - 'tools/rosters/**'
      - 'tools/playbooks/**'
      - 'tools/movement/**'
      - 'tools/audio/**'
      - 'tools/environments/**'
      - 'scripts/**'
      - 'hosting/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/game-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-tooling:
    name: Core inventory and build-tool units (no Unity)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.1'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.100'
      - name: Select the tested SDK
        run: |
          printf '{"sdk":{"version":"10.0.100","rollForward":"disable"}}\n' > global.json
      - name: Core tests with exact case inventory and source hash guard
        run: python3 tests/run-core.py
      - name: Test the inventory failure gates
        run: python3 tests/test-runner.py
      - name: Test detached source match and input contracts
        run: |
          python3 tests/contracts/test_runner.py
          python3 tests/contracts/run.py
      - name: Test offline roster exporter without original data
        run: python3 -B -m unittest discover -s tools/rosters/tests -q
      - name: Test immutable roster reader against synthetic input
        run: |
          python3 -B tools/rosters/tests/fixtures.py
          dotnet run --project tools/rosters/checks/SourceRoster.Checks.csproj --configuration Release -p:NuGetAudit=false -- tools/rosters/SourceData/synthetic-rosters.json
      - name: Test original playbook runner failure gates
        run: python3 -B -m unittest discover -s tests/playbooks -p 'test_*.py' -q
      - name: Fetch verified original playbook and AI inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/playbooks/fetch_inputs.py
      - name: Compare original playbooks and AI decisions
        run: python3 tests/playbooks/run.py
      - name: Compare original movement and evasion without Unity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/movement/run.py --fetch-inputs --sdk-netstandard21
          python3 -B -m unittest discover -s tests/movement -p 'test_publication.py' -q
      - name: Test original environment conversion without original assets
        run: |
          python3 -B tools/environments/test_prepare_environment.py -q
          python3 -B tools/environments/test_publication_profiles.py -q
          python3 -B tools/environments/run_reader_checks.py --synthetic-only
      - name: Fetch verified original C oracle inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/source-oracles/fetch_inputs.py
      - name: Test pinned-source oracle extraction
        run: python3 -B -m unittest discover -s tests/source-oracles -p 'test_*.py'
      - name: Execute original C reference cases
        run: python3 tests/source-oracles/run.py --source-root tests/source-oracles/.artifacts/original --full-matrix
      - name: Compare source gameplay and host adapter
        run: python3 tests/parity/run.py --cases tests/source-oracles/.artifacts/cases.json --full-kernel
      - name: Test source-player preparation without original assets
        run: python3 -B -m unittest discover -s tools/assets -p 'test_*.py'
      - name: Test original-animation input reader without original assets
        run: python3 -B -m unittest discover -s tools/animation/tests
      - name: Test generated-player parsing and geometry
        run: python3 tests/assets/run.py
      - name: Test source-camera behavior
        run: python3 tests/camera/run.py
      - name: Test original audio package reader without banks or Unity
        run: python3 tests/audio/run.py --mutate
      - name: Test browser assertions and isolated runtime
        run: node --test tests/browser/lib.test.mjs tests/browser/runtime.test.mjs tests/viewport/gpu.test.mjs
      - name: Validate Unity metadata and script references
        run: python3 tests/test-unity-metadata.py
      - name: Build-tool unit checks
        run: python3 scripts/test-webgl-tooling.py
      - name: Build and hosting shell syntax
        run: |
          bash -n scripts/build-webgl.sh scripts/serve-webgl.sh
          sh -n scripts/verify-webgl.sh hosting/entrypoint.sh
