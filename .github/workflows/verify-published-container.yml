name: Inspect private package metadata on isolated diagnostic branch

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    if: github.repository == 'long2know/nflblitz' && github.ref == 'refs/heads/stlong/nov12-private-package-metadata'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact endpoint, HTTP status, package fields and immutable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          token = os.environ.pop("GH_TOKEN")
          base = "https://api.github.com/users/long2know/packages/container/nflblitz-private"
          def get(url):
              request = Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      status, raw = response.status, response.read(4 * 1024 * 1024)
              except HTTPError as error:
                  status, raw = error.code, error.read(4 * 1024 * 1024)
              return status, json.loads(raw)
          status, package = get(base)
          selected = {
              "endpoint": base,
              "http_status": status,
              "owner": {"login": (package.get("owner") or {}).get("login"),
                        "type": (package.get("owner") or {}).get("type")},
              "name": package.get("name"),
              "package_type": package.get("package_type"),
              "visibility": package.get("visibility"),
              "repository": {"full_name": (package.get("repository") or {}).get("full_name")},
              "message": package.get("message"),
          }
          if status == 200:
              selected["guard_comparisons"] = {
                  "visibility_private": selected["visibility"] == "private",
                  "type_container": selected["package_type"] == "container",
                  "name_nflblitz_private": selected["name"] == "nflblitz-private",
                  "owner_long2know": selected["owner"]["login"] == "long2know",
                  "repository_long2know_nflblitz":
                      selected["repository"]["full_name"] == "long2know/nflblitz",
              }
              endpoint = base + "/versions?per_page=20"
              version_status, versions = get(endpoint)
              selected["versions_endpoint"] = endpoint
              selected["versions_http_status"] = version_status
              selected["versions_message"] = versions.get("message") if isinstance(versions, dict) else None
              selected["versions"] = [
                  {"id": row["id"], "name": row["name"],
                   "tags": row.get("metadata", {}).get("container", {}).get("tags", [])}
                  for row in versions] if version_status == 200 else []
          print(json.dumps(selected, indent=2, sort_keys=True))
          PY
