name: nflblitz-original

services:
  game:
    image: "${NFLBLITZ_IMAGE:-ghcr.io/long2know/nflblitz:latest}"
    platform: "${NFLBLITZ_PLATFORM:-linux/amd64}"
    pull_policy: never
    user: "${NFLBLITZ_USER:-1000:1000}"
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      BASE_URL: "${BASE_URL-/nflblitz}"
    ports:
      - "${NFLBLITZ_PORT:-8920}:8080"
    # Optional, unused by the game: browser IndexedDB is the save store.
    volumes:
      - "${DOCKER_DATA:?Set DOCKER_DATA to an owned parent directory}/nflblitz:/app/data"
