worker_processes 2;
pid @RUNTIME_DIR@/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/x-icon ico;
        audio/wav wav;
        audio/ogg ogg;
        audio/mpeg mp3;
        text/tab-separated-values tsv;
    }
    sendfile on;
    gzip off;
    etag off;
    if_modified_since off;
    client_body_temp_path @RUNTIME_DIR@/client;
    proxy_temp_path @RUNTIME_DIR@/proxy;
    fastcgi_temp_path @RUNTIME_DIR@/fastcgi;
    uwsgi_temp_path @RUNTIME_DIR@/uwsgi;
    scgi_temp_path @RUNTIME_DIR@/scgi;

    server {
        listen 8080;
        root /opt/nflblitz/www;
        index index.html;
        autoindex off;
        absolute_redirect off;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Fixed-name Webcil/modules/data must never survive an image update in cache.
        add_header Cache-Control no-store always;

        location ~ (^|/)\. {
            return 404;
        }

        # BASE_URL_BEGIN
        location = /favicon.ico {
            return 204;
        }

        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri =404;
            limit_except GET {
                deny all;
            }
        }
        # BASE_URL_END
    }
}
