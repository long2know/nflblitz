# External HTTPS proxy only; do not replace the frozen image's nginx.conf.
server {
    listen 443 ssl;
    server_name emulation.long2know.com;
    client_max_body_size 50000M;
    error_page 497 https://$host$request_uri;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/emulation.long2know.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emulation.long2know.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location = /nflblitz {
        absolute_redirect off;
        return 308 /nflblitz/$is_args$args;
    }

    location ^~ /nflblitz/ {
        # The trailing slash strips ONLY this prefix before forwarding.
        proxy_pass http://192.168.0.10:18098/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_redirect off;
        gzip off;
        # Upstream owns MIME, ranges, 404 and isolation/no-store headers.
        # Do not include an unverified shared proxy snippet in this location.
    }

    location / {
        proxy_pass http://192.168.0.10:8910;
        include ./nginx-proxy-common.conf;
    }
}
