name: nflblitz-original

services:
  game:
    image: ghcr.io/long2know/nflblitz:latest
    platform: linux/amd64
    pull_policy: never
    user: "101:101"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    stop_signal: SIGQUIT
    restart: unless-stopped
    # Retain the image's existing runtime healthcheck.
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0700
    ports:
      - "192.168.0.10:18098:8080"
