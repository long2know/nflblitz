worker_processes auto;
pid /var/cache/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        application/octet-stream data bundle;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
        font/woff2 woff2;
        font/ttf ttf;
        audio/ogg ogg;
    }
    sendfile on;
    etag on;
    gzip off;
    client_body_temp_path /var/cache/nginx/client;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Initial filenames are not content-hashed; revalidate rather than cache stale players.
        add_header Cache-Control no-cache always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ (^|/)\. {
            return 404;
        }

        location ~* \.(gz|br|unityweb)$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 = @missing;
        location @missing {
            types {}
            default_type text/plain;
            return 404 "WebGL artifact not found. Build and deploy the complete Build/WebGL player.\n";
        }
    }
}
